[workspace]
name = "bundle-nemo"
version = "0.1.0"
description = "BundleNeMO: Neural Memory Object Tracking & Canonical 3D Reconstruction (Pure Python)"
authors = ["Shenghao <shzhou@udel.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
pytorch-gpu = ">=2.5.0,<3"
torchvision = "*"
open3d = ">=0.19.0"
rerun-sdk = ">=0.28.0"
scipy = "*"
scikit-learn = "*"
matplotlib = "*"
pillow = "*"
tqdm = "*"
einops = "*"
omegaconf = "*"
pyyaml = "*"
py-opencv = ">=4.10.0"
plotly = "*"
python-kaleido = "*"
pandas = "*"
joblib = "*"
pip = "*"

[tasks]
test = "python -m unittest discover -s tests -p 'test_*.py'"
track-cross-icp = "python run_bundle_nemo.py --alignment_mode cross_icp"
track-pose-graph = "python run_bundle_nemo.py --alignment_mode pose_graph"
track-realtime = "python run_bundle_nemo.py --decode_stride 2"
